services:
  postgres:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scriptutils
      POSTGRES_PASSWORD: scriptutils
    ports:
      - "5432:5432"
  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:rw
  scriptutils:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./scriptutils.properties:/app/scriptutils.properties
